<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>VoiceMale Music Library</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>VoiceMale</h1>
    <p class="lead">Music library for choir members</p>

    <form id="unlock">
      <label for="password">Choir password</label>
      <div class="field">
        <input id="password" type="password" autocomplete="current-password"
               autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <button type="button" id="reveal" class="reveal" aria-pressed="false" aria-label="Show password" title="Show password">
          <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.6M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>
        </button>
      </div>
      <button type="submit">Open Current Songs</button>
    </form>
    <p id="message" role="status"></p>
  </main>
</body>
</html>
